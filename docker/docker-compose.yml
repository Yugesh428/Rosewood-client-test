services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rosewood_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       rosewood
      POSTGRES_USER:     rosewood_user
      POSTGRES_PASSWORD: rosewood_pass
    ports:
      - "5432:5432"
    volumes:
      - rosewood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosewood_user -d rosewood"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js App ──────────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rosewood_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://rosewood_user:rosewood_pass@db:5432/rosewood?sslmode=disable
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ../public/uploads:/app/public/uploads

  # ── Seed Job (one-shot) ──────────────────────────────────────────────────────
  seed:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rosewood_seed
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://rosewood_user:rosewood_pass@db:5432/rosewood?sslmode=disable
      NODE_ENV: production
      SEED_ADMIN_NAME:     "Rosewood Admin"
      SEED_ADMIN_EMAIL:    "admin@rosewood.com"
      SEED_ADMIN_PASSWORD: "Admin@1234"
    command: npx tsx --tsconfig tsconfig.scripts.json docker/seed-admin.ts

volumes:
  rosewood_pgdata:
    driver: local
